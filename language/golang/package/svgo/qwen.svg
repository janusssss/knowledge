<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
    <!-- 红色背景 -->
    <rect width="100%" height="100%" fill="#B22222"/>

    <!-- 角色轮廓（简化为几何形状） -->
    <g fill="#000" stroke="#000" stroke-width="2">
        <!-- 上半身 -->
        <path d="M180 300 Q180 200 220 180 C260 160 300 200 300 240 Q300 280 260 300 C220 320 180 280 180 240 Z"
              stroke="none"/>

        <!-- 头部 -->
        <circle cx="200" cy="180" r="40" stroke="none"/>

        <!-- 帽子 -->
        <path d="M160 160 L240 160 Q260 140 240 120 L160 120 Q140 140 160 160 Z"
              fill="#000" stroke="none"/>

        <!-- 眼睛（简化为两个白色圆形） -->
        <circle cx="180" cy="170" r="8" fill="#FFF"/>
        <circle cx="220" cy="170" r="8" fill="#FFF"/>

        <!-- 红色装饰条（袖口和帽绳） -->
        <rect x="170" y="280" width="60" height="5" rx="2" fill="#CC0000"/>
        <line x1="180" y1="200" x2="220" y2="200" stroke="#CC0000" stroke-width="4"/>
    </g>
</svg>