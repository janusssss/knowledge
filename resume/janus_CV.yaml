    项目经历:
      - name: 数据中转程序
        date:
        start_date: 
        end_date: 
        location: 北京
        summary: 基于TCP与AF_PACKET协议转换的数据中转程序，支持从TCP接收数据经AF_PACKET转发，同时支持从AF_PACKET接收数据经TCP转发，实现双向传输
        highlights:
          - 重构原有C程序链路为Go单服务，解决多协议转换场景下的性能瓶颈与运维复杂度问题，千兆场景下吞吐量从300Mbps提升至900Mbps
          - 将原有TCP→KCP→AF_PACKET→KCP→TCP多程序流转链路，优化为单Go服务直连，减少协议转换次数与跨程序调用开销
          - 重构报文头，其长度与标准TCP/IP以太网帧头对齐，避免AF_PACKET收发时的额外数据填充，降低传输延迟
          - 使用pprof定位性能瓶颈，发现高频内存分配是主要痛点，引入sync.Pool复用对象池，降低GC开销，提升吞吐稳定性
          - 设计基于原子计数与信号量的日志采样机制，减少高频日志打印带来的I/O开销，兼顾性能与排障能力
